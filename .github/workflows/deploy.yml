name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy on VPS
        run: |
          set -e
          TARGET_DIR="${{ secrets.TARGET_DIR }}"
          TARGET_DIR="${TARGET_DIR:-/var/www/cartaodetodos}"
          # write private key to temporary file from secret and secure it
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} bash -s "$TARGET_DIR" << 'EOF'
            TARGET_DIR="$1"
            set -e
            cd "$TARGET_DIR"
            git fetch --all
            git reset --hard origin/main
            npm install --production
            
            # Limpar arquivos desnecessários
            if [ -f "limpar-vps.sh" ]; then
              bash limpar-vps.sh || true
            else
              # Limpeza manual se o script não existir
              rm -f deploy-automatico.sh deploy-vps.sh stop-server.ps1 test-connection.js 2>/dev/null || true
              rm -f Dockerfile docker-compose.yml vercel.json default.php 2>/dev/null || true
              rm -rf .github 2>/dev/null || true
              find . -name "*.log" -type f -delete 2>/dev/null || true
              find . -name "*.tmp" -type f -delete 2>/dev/null || true
            fi
            
            # Reiniciar Nginx se a configuração mudou
            if [ -f "nginx-cartaodetodos.conf" ]; then
              sudo cp nginx-cartaodetodos.conf /etc/nginx/sites-available/cartaodetodos.cloud 2>/dev/null || true
              sudo ln -sf /etc/nginx/sites-available/cartaodetodos.cloud /etc/nginx/sites-enabled/cartaodetodos.cloud 2>/dev/null || true
              sudo nginx -t && sudo systemctl reload nginx 2>/dev/null || true
            fi
            
            pm2 restart cartaodetodos || pm2 start server.js --name cartaodetodos
          EOF
          # remove temporary key
          rm -f /tmp/deploy_key