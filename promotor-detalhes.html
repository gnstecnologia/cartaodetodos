<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes do Promotor - Cartão de Todos</title>
    <link rel="icon" type="image/png" sizes="64x64" href="faviconV2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@700&family=Ubuntu:wght@400;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      window.API_BASE_URL = 'http://localhost:3000';
    </script>
    <style>
      .promotor-detalhes-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
      }

      .promotor-detalhes-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .promotor-detalhes-title {
        font-family: 'Source Sans 3', sans-serif;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        font-weight: 700;
        background: linear-gradient(135deg, var(--color-white), var(--color-highlight));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .promotor-metricas-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }

      .metrica-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.95));
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.3);
        position: relative;
        overflow: hidden;
      }

      .metrica-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--color-background), var(--color-highlight));
      }

      .metrica-label {
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        color: rgba(15, 31, 19, 0.7);
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .metrica-value {
        font-family: 'Source Sans 3', sans-serif;
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--color-background);
      }

      .valor-gerado-card {
        /* Mesmo estilo dos outros cards - fundo branco */
      }

      .valor-gerado-card .metrica-value {
        color: var(--color-background);
        font-size: 2rem;
      }

      .filters-section {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.95));
        backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .filters-title {
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--color-dark);
        margin-bottom: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .filters-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 1rem;
        align-items: end;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .filter-label {
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        color: rgba(15, 31, 19, 0.7);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .filter-input, .filter-select {
        padding: 0.75rem;
        border-radius: 12px;
        border: 2px solid rgba(15, 138, 60, 0.25);
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-size: 16px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: white;
      }

      .filter-input:focus, .filter-select:focus {
        outline: none;
        border-color: var(--color-background);
        box-shadow: 0 0 0 3px rgba(15, 138, 60, 0.1);
      }

      .filter-btn, .clear-btn {
        background: linear-gradient(135deg, var(--color-background), #13c053);
        color: white;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 12px;
        cursor: pointer;
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-weight: 700;
        transition: all 0.3s ease;
      }

      .clear-btn {
        background: rgba(15, 31, 19, 0.1);
        color: var(--color-dark);
        border: 2px solid rgba(15, 31, 19, 0.2);
      }

      .filter-btn:hover, .clear-btn:hover {
        transform: translateY(-2px);
      }

      .leads-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
      }

      @media (max-width: 1200px) {
        .leads-list {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 768px) {
        .leads-list {
          grid-template-columns: 1fr;
        }
      }

      .lead-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.95));
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 1.75rem;
        box-shadow: 
          0 8px 32px rgba(0, 0, 0, 0.12),
          0 0 0 1px rgba(255, 255, 255, 0.8) inset,
          0 1px 0 rgba(255, 255, 255, 0.9) inset;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-left: 5px solid var(--color-background);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }

      .lead-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--color-background), var(--color-highlight), #13c053);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .lead-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 
          0 20px 60px rgba(0, 0, 0, 0.15),
          0 0 0 1px rgba(255, 255, 255, 0.9) inset,
          0 0 40px rgba(15, 138, 60, 0.2);
        border-left-width: 6px;
      }

      .lead-card:hover::before {
        opacity: 1;
      }

      .lead-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1.25rem;
        gap: 1rem;
      }

      .lead-name {
        font-family: 'Source Sans 3', sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--color-dark);
        margin: 0;
        line-height: 1.3;
        flex: 1;
        word-break: break-word;
      }

      .status-badge {
        padding: 0.5rem 1rem;
        border-radius: 25px;
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
        flex-shrink: 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .status-nova { 
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.15), rgba(37, 99, 235, 0.1)); 
        color: #2563eb; 
        border: 1px solid rgba(37, 99, 235, 0.2);
      }
      .status-contato { 
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.1)); 
        color: #f59e0b; 
        border: 1px solid rgba(245, 158, 11, 0.2);
      }
      .status-negociacao { 
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(139, 92, 246, 0.1)); 
        color: #8b5cf6; 
        border: 1px solid rgba(139, 92, 246, 0.2);
      }
      .status-fechado { 
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.1)); 
        color: #10b981; 
        border: 1px solid rgba(16, 185, 129, 0.2);
      }
      .status-perdido { 
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.1)); 
        color: #ef4444; 
        border: 1px solid rgba(239, 68, 68, 0.2);
      }

      .lead-info {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-size: 0.9rem;
        color: rgba(15, 31, 19, 0.7);
        margin-bottom: 1rem;
      }

      .info-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem;
        border-radius: 10px;
        transition: all 0.2s ease;
        background: rgba(15, 138, 60, 0.02);
      }

      .info-item:hover {
        background: rgba(15, 138, 60, 0.05);
        transform: translateX(3px);
      }

      .info-item i {
        color: var(--color-background);
        width: 18px;
        text-align: center;
        font-size: 1rem;
      }

      .info-item span {
        flex: 1;
        word-break: break-word;
      }

      .nav-btn {
        background: rgba(255, 255, 255, 0.2);
        color: var(--color-white);
        border: 2px solid rgba(255, 255, 255, 0.3);
        padding: 0.75rem 1.5rem;
        border-radius: 12px;
        cursor: pointer;
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-weight: 700;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
      }

      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      .loading, .error {
        text-align: center;
        padding: 3rem;
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-size: 1.1rem;
        color: var(--color-dark);
      }

      .empty-state {
        text-align: center;
        padding: 4rem 2rem;
        color: rgba(15, 31, 19, 0.5);
      }

      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2rem;
        flex-wrap: wrap;
      }

      .pagination-btn {
        background: white;
        border: 2px solid rgba(15, 138, 60, 0.25);
        color: var(--color-dark);
        padding: 0.75rem 1rem;
        border-radius: 12px;
        cursor: pointer;
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .pagination-btn:hover:not(:disabled) {
        background: var(--color-background);
        color: white;
        border-color: var(--color-background);
      }

      .pagination-btn.active {
        background: var(--color-background);
        color: white;
      }

      .pagination-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .export-btn {
        background: linear-gradient(135deg, var(--color-background), #13c053);
        color: white;
        border: none;
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        cursor: pointer;
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-weight: 700;
        font-size: 0.9rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        box-shadow: 0 2px 8px rgba(15, 138, 60, 0.2);
        position: relative;
        overflow: hidden;
      }

      .export-btn::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        transform: translate(-50%, -50%);
        transition: width 0.4s ease, height 0.4s ease;
      }

      .export-btn:hover::before {
        width: 300px;
        height: 300px;
      }

      .export-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(15, 138, 60, 0.3);
      }

      .export-btn:active {
        transform: translateY(0);
      }

      .export-btn i {
        font-size: 1rem;
      }

      .lead-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 2px solid rgba(15, 138, 60, 0.1);
      }

      .lead-action-btn {
        flex: 1;
        padding: 0.65rem 1rem;
        border-radius: 10px;
        border: none;
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .lead-action-btn.view,
      .timeline-btn {
        background: linear-gradient(135deg, var(--color-background), #13c053);
        color: white;
        box-shadow: 0 2px 8px rgba(15, 138, 60, 0.2);
      }

      .lead-action-btn.view:hover,
      .timeline-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(15, 138, 60, 0.3);
      }

      .lead-action-btn i,
      .timeline-btn i {
        font-size: 0.9rem;
      }

      .timeline-btn {
        flex: 1;
        padding: 0.65rem 1rem;
        border-radius: 10px;
        border: none;
        font-family: 'Inter', 'Ubuntu', sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      @media (max-width: 768px) {
        .promotor-detalhes-container {
          padding: 1rem;
        }

        .filters-row {
          grid-template-columns: 1fr !important;
        }

        .filters-section > div:first-child {
          flex-direction: column !important;
          align-items: flex-start !important;
          gap: 1rem;
        }

        .filters-title {
          margin-bottom: 1rem !important;
          width: 100%;
        }

        .export-btn {
          flex: 1;
          min-width: 100px;
        }

        .lead-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .lead-name {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="site-header">
      <div class="site-header__logo">
        <img src="LOGO.webp" alt="Cartão de Todos" />
      </div>
    </div>

    <div class="promotor-detalhes-container">
      <div class="promotor-detalhes-header">
        <h1 class="promotor-detalhes-title" id="promotorNome">
          <i class="fas fa-user-tie"></i>
          Carregando...
        </h1>
        <div style="display: flex; gap: 1rem;">
          <a href="promotores.html" class="nav-btn">
            <i class="fas fa-arrow-left"></i> Voltar
          </a>
          <a href="dashboard.html" class="nav-btn">
            <i class="fas fa-chart-bar"></i> Dashboard
          </a>
        </div>
      </div>

      <!-- Métricas do Promotor -->
      <div class="promotor-metricas-grid" id="metricasGrid"></div>

      <!-- Filtros -->
      <div class="filters-section">
        <div style="display: flex; align-content: center; justify-content: space-between;">
          <h2 class="filters-title">
            <i class="fas fa-filter"></i>
            Filtros
          </h2>
          <div style="display: flex; gap: 0.75rem; align-items: center; justify-content: flex-end; margin-top: 1rem; flex-wrap: wrap;">
            <button onclick="exportPromotorLeadsData('csv')" class="export-btn export-btn-csv" title="Baixar CSV">
              <i class="fas fa-file-csv"></i> CSV
            </button>
            <button onclick="exportPromotorLeadsData('excel')" class="export-btn export-btn-excel" title="Baixar Excel">
              <i class="fas fa-file-excel"></i> Excel
            </button>
            <button onclick="exportPromotorLeadsData('txt')" class="export-btn export-btn-txt" title="Baixar TXT">
              <i class="fas fa-file-alt"></i> TXT
            </button>
          </div>
        </div>
        <div class="filters-row" style="margin-top: 1.5rem;">
          <div class="filter-group">
            <label class="filter-label">
              <i class="fas fa-search"></i>
              Buscar Lead
            </label>
            <input 
              type="text" 
              id="searchFilter" 
              class="filter-input" 
              placeholder="Nome ou telefone"
              oninput="applyFilters()"
            />
          </div>
          <div class="filter-group">
            <label class="filter-label">
              <i class="fas fa-filter"></i>
              Status
            </label>
            <select id="statusFilter" class="filter-select" onchange="applyFilters()">
              <option value="">Todos os Status</option>
              <option value="Nova Indicação">Nova Indicação</option>
              <option value="Em Contato">Em Contato</option>
              <option value="Em Negociação">Em Negociação</option>
              <option value="Fechado">Fechado</option>
              <option value="Perdido">Perdido</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">
              <i class="fas fa-sort"></i>
              Ordenar por
            </label>
            <select id="sortFilter" class="filter-select" onchange="applyFilters()">
              <option value="recentes">Mais Recentes</option>
              <option value="antigos">Mais Antigos</option>
              <option value="nome-az">Nome A-Z</option>
              <option value="nome-za">Nome Z-A</option>
            </select>
          </div>
          <div style="display: flex; gap: 0.75rem; align-items: flex-end;">
            <button class="filter-btn" onclick="applyFilters()">
              <i class="fas fa-search"></i> Buscar
            </button>
            <button class="clear-btn" onclick="clearFilters()">
              <i class="fas fa-times"></i> Limpar
            </button>
          </div>
        </div>
      </div>

      <div id="loading" class="loading" style="display: none;">
        <i class="fas fa-spinner fa-spin"></i> Carregando dados...
      </div>

      <div id="error" class="error" style="display: none;"></div>

      <div id="content" style="display: none;">
        <div id="leadsList" class="leads-list"></div>
        <div id="pagination" class="pagination"></div>
      </div>
    </div>

    <script src="scripts/export-utils.js"></script>
    <script src="scripts/promotor-detalhes.js"></script>
  </body>
</html>
